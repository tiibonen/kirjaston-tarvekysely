<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uuden kirjaston tarvekysely</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    *{margin:0;padding:0;box-sizing:border-box;}

    body{
      font-family:Inter,sans-serif;
      background:#f6f8fc;
      color:#23324a;
      display:flex;
      justify-content:center;
      padding:40px 20px;
    }

    .container{
      width:100%;
      max-width:900px;
      background:white;
      border-radius:28px;
      padding:48px;
      box-shadow:0 10px 30px rgba(0,0,0,.08);
    }

    h1{
      font-size:2rem;
      margin-bottom:12px;
      text-align:center;
    }

    .subtitle{
      text-align:center;
      color:#64748b;
      margin-bottom:36px;
      line-height:1.5;
    }

    .preview{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
      gap:18px;
      margin:36px 0;
    }

    .card{
      aspect-ratio:2/3;
      border-radius:22px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      font-weight:600;
      text-align:center;
      padding:18px;
      transition:.2s;
    }

    .card:hover{
      transform:translateY(-4px);
    }

    .blue{background:#d9efff;}
    .purple{background:#eadfff;}

    .emoji{
      font-size:48px;
      margin-bottom:18px;
    }

    button{
      width:100%;
      padding:18px;
      border:none;
      border-radius:16px;
      background:#2563eb;
      color:white;
      font-size:1rem;
      font-weight:700;
      cursor:pointer;
    }

    button:hover{
      background:#1d4ed8;
    }

    .footer{
      margin-top:28px;
      text-align:center;
      color:#94a3b8;
      font-size:.9rem;
    }
  </style>
</head>
<body>

<div class="container">

  <h1>Uuden kirjaston tarvekysely</h1>

  <p class="subtitle">
    Valitse tärkeimmät toimintakortit ja ominaisuuskortit.
    Järjestä ne tärkeysjärjestykseen – näin autat suunnittelemaan uuden kirjaston.
  </p>

  <div class="preview">

    <div class="card blue">
      <div class="emoji">📖</div>
      Hiljainen lukeminen
    </div>

    <div class="card blue">
      <div class="emoji">🎮</div>
      Pelaaminen
    </div>

    <div class="card purple">
      <div class="emoji">🛋️</div>
      Nojatuoleja
    </div>

    <div class="card purple">
      <div class="emoji">🚪</div>
      Hiljaisia työtiloja
    </div>

  </div>

  <button>Aloita kysely →</button>

  <div class="footer">
    Mäntyharjun uuden kirjaston suunnittelu
  </div>

</div>

</body>
</html>
